[project]
name = "deflake-backend"
version = "0.1.0"
description = "Deflake API and runner"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"runner/tests/**" = ["S101", "S311"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"
